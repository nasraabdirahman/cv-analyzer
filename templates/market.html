<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/market.css') }}">
</head>
<body>

    <div class="search-container">
        <input type="text"
               class="search-bar"
               placeholder="Search Jobs...">
    </div>

    <div class="jobs-list">

        {% for job in jobs %}

        <div class="job-card">

            <div class="job-title">
                {{ job.title }}
            </div>

            <div class="job-company">
                {{ job.company }}
            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
