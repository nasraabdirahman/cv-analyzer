<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/market.css') }}">
</head>

<body>

    <a href="/" class="home-button">Home</a>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="container">

        <div class="sidebar">

            <input
                type="text"
                class="search-bar"
                placeholder="Search Jobs..."
            >

            <div class="jobs-list">

                {% for job in jobs %}

                <a class="job-card"
                   href="{{ url_for('apply', job_id=job['id']) }}">

                    <div class="job-title">
                        {{ job["title"] }}
                    </div>

                    <div class="job-company">
                        {{ job["company"] }}
                    </div>

                    <div class="job-location">
                        {{ job["location"] }}
                    </div>

                    <div class="job-description">
                        {{ job["shortDescription"] }}
                    </div>

                </a>

                {% endfor %}

            </div>

        </div>

    </div>

</body>
</html>
