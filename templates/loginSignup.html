<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/loginSignup.css">
    <script defer type="module" src="{{ url_for('static', filename='js/colourTheme.js')}}"></script>
    <script defer type="module" src="{{ url_for('static', filename='js/loginSignup.js')}}"></script>
    <title>login</title>
</head>
<body>
  <div class="errorDiv">
    <div class="error-message"> </div>
  </div>
  <section class="container">
      <div class="input-container login">
        <form method="post" action="/login" class="loginForm">
          <h2 class="h2 stack-sans-headline-title"> Login </h2>
          <p class="p stack-sans-headline-mainText">Please fill in your details below!</p>
          <input type="username" name="username" placeholder="Username" maxlength="30">
          <input type="password" name="password" placeholder="Password" maxlength="30">
          <button class="standard-button" type="submit" >
            Login
          </button>
        </form>
      </div>

    <div class="input-container signup">
        <form method="post" action="/signup" class="signupForm">
          <h2 class="h2 stack-sans-headline-title"> Create Account</h2>
          <p class="p stack-sans-headline-mainText">Please fill in your details below!</p>
          <input type="text" name="firstName" placeholder="First Name" maxlength="30">
          <input type="text" name="lastname" placeholder="LastName" maxlength="50">
          <input type="text" name="companyName" placeholder="Company name" maxlength="50">
          <input type="email" name="email" placeholder="Email" maxlength="50">
          <input type="username" name="username" placeholder="Username" maxlength="30">
          <input type="password" name="password" placeholder="Password" maxlength="30">
          <input type="password" name="passwordR" placeholder="Repeat Password" maxlength="30">
          <button class="standard-button" type="submit" >
            Signup
          </button>
       </form>
    </div>
    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-right">
            <h2 class="h2 stack-sans-headline-title"> Welcome Back </h2>
            <p class="p stack-sans-headline-mainText">If you don't already have an account</p>
            <button class="standard-button signup-button"> 
              Signup 
            </button>
        </div>

        <div class="toggle-panel toggle-left">
            <h2 class="h2 stack-sans-headline-title"> New to Us </h2>
            <p class="p stack-sans-headline-mainText">If you already have an account</p>
            <button class="standard-button login-button"> 
              Login
            </button>
        </div>
      </div>
    </div>
  </section>
  <footer>
    <h2 class="footer-text stack-sans-headline-title "> Contact </h2>
    <a class="main-body-text-link stack-sans-headline-mainText" href="https://github.com/nasraabdirahman/cv-analyzer"> https://github.com/nasraabdirahman/cv-analyzer </a>
    <section class="colour-scheme-switcher" aria-label="colour-scheme-switcher">
      <span class="scheme-switcher_slider"></span>
        <button class="scheme-switcher_button stack-sans-headline-mainText" aria-pressed="false" value="light">
          Light
        </button>
        <button class="scheme-switcher_button stack-sans-headline-mainText" aria-pressed="false" value="dark">
          Dark
        </button>
    </section>
  </footer>
</body>
</html>
